name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Configure Keystore for Release Signing
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Split-per-ABI Release APKs
        run: flutter build apk --release --split-per-abi --no-tree-shake-icons

      - name: Archive Split APKs
        run: |
          mkdir -p release_apks
          TAG_NAME="${{ github.ref_name }}"
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_apks/cadence-${TAG_NAME}-arm64-v8a.apk
          fi

      - name: Build Universal Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Archive Universal APK
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk release_apks/cadence-${TAG_NAME}-universal.apk
          fi
          echo "=== Release Artifacts ==="
          ls -lh release_apks/

      - name: Create GitHub Release & Upload APKs
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Cadence ${{ github.ref_name }}
          body: |
            ### Ban phat hanh Cadence ${{ github.ref_name }}
            
            #### Tap tin APK:
            - **cadence-${{ github.ref_name }}-arm64-v8a.apk (Khuyen dung - Toi uu dung luong)**: Toi uu cho cac dong thiet bi Android 64-bit hien dai.
            - **cadence-${{ github.ref_name }}-universal.apk (Ban pho thong)**: Tuong thich voi moi thiet bi Android.
            
            #### Chi tiet cap nhat:
            - Quan ly Ngan sach & Canh bao han muc: Thiet lap ngan sach thang de theo doi tien do chi tieu; thanh tien do chuyen mau thong minh (Xanh -> Vang -> Do) va canh bao tuc thi khi sap cham hoac vuot tran ngan sach.
            - Bieu do tron (Donut Chart): Bieu do phan bo chi tieu theo danh muc truc quan voi tuong tac cham chon lat de xem ti le phan tram va so tien.
            - So sanh bien dong theo ky: Phan tich chenh lech chi tieu so voi ky truoc (Tuan, Thang, Nam) voi ty le phan tram tang/giam va so tien tiet kiem duoc.
            - Cai dat giao dien: Bo cuc luoi chu de 4 mau 1 hang can deu tu trai; gop tien te va ngon ngu vao Dropdown giup tiet kiem hon 450px chieu doc man hinh.
            - Da ngon ngu mo rong: Bo sung 4 ngon ngu moi (Korean, Spanish, German, Russian), nang tong so ngon ngu ho tro len 9 ngon ngu quoc te.
            - Canh bao han muc khi ghi chep: Tich hop thong bao canh bao tuc thi khi giao dich ghi chep vuot 80% hoac vuot 100% ngan sach thang.
          draft: false
          prerelease: false
          files: release_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
