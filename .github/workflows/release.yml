name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: 'stable'
          cache: true

      - name: Configure Keystore for Release Signing
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Split-per-ABI Release APKs
        run: flutter build apk --release --split-per-abi

      - name: Archive Split APKs
        run: |
          mkdir -p release_apks
          TAG_NAME="${{ github.ref_name }}"
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_apks/cadence-${TAG_NAME}-arm64-v8a.apk
          fi

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Archive Universal APK
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk release_apks/cadence-${TAG_NAME}-universal.apk
          fi
          echo "=== Release Artifacts ==="
          ls -lh release_apks/

      - name: Create GitHub Release & Upload APKs
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Cadence ${{ github.ref_name }}
          body: |
            ### Ban phat hanh Cadence ${{ github.ref_name }}
            
            #### Tap tin APK:
            - **cadence-${{ github.ref_name }}-arm64-v8a.apk (Khuyen dung - Toi uu dung luong)**: Toi uu cho cac dong thiet bi Android 64-bit hien dai.
            - **cadence-${{ github.ref_name }}-universal.apk (Ban pho thong)**: Tuong thich voi moi thiet bi Android.
            
            #### Chi tiet cap nhat:
            - Cai dat giao dien: Bo sung 8 phong cach mau toi dang hinh tron tinh te, khong chu thich dai dong.
            - Da ngon ngu: Ho tro Tieng Viet, English, Francais, Japanese, Chinese cap nhat tuc thi tren toan ung dung.
            - Da tien te: Ho tro VND, USD, EUR, JPY, GBP, KRW, SGD.
            - Du lieu mac dinh: Lam sach hoan toan du lieu mau, khoi tao co so du lieu trang thai rong.
            - Cap nhat tuc thi: Dong bo hoa du lieu tuc thoi giua cac man hinh ma khong can thao tac lam moi.
            - So giao dich: Vuot phai de sua giao dich, vuot trai de xoa giao dich.
            - Quet hoa don: Ho tro phan loai hoa don mua hang (Chi tieu) hoac bill khach chuyen khoan (Thu nhap).
            - Danh muc: Phan tach ro rang danh muc Thu va Chi, ho tro nguoi dung tao them danh muc ca nhan hoa.
            - Tinh gon thao tac: Toi gian con duy nhat 1 nut them cho moi man hinh.
            - Phan tich: Tinh toan bien dong tuan trong thang chinh xac theo lich thoi gian thuc; hien thi trung binh theo ngay, tuan hoac thang.
          draft: false
          prerelease: false
          files: release_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
